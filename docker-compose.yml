version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  ledger-migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services/ledger-service/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable&x-migrations-table=ledger_schema_migrations"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  projection-migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services/projection-service/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable&x-migrations-table=projection_schema_migrations"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    environment:
      KAFKA_BROKERS: kafka:29092
    entrypoint: ["sh", "/create-topics.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  wallet-service:
    build: ./services/wallet-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: wallet_app
      SPRING_DATASOURCE_PASSWORD: wallet_app
      FLYWAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      FLYWAY_DATASOURCE_USERNAME: ledger
      FLYWAY_DATASOURCE_PASSWORD: ledger
      LEDGER_SERVICE_URL: http://ledger-service:8081
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  ledger-service:
    build: ./services/ledger-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://ledger_app:ledger_app@postgres:5432/ledger?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      DAILY_TRANSFER_CAP: "100000.00"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-migrate:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  projection-service:
    build: ./services/projection-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://projection_app:projection_app@postgres:5432/ledger?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: projection-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      projection-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
