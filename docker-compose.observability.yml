services:
  jaeger:
    # Jaeger v2 (ADR-0014): a distribution of the OTel Collector core with
    # Jaeger's storage/query/UI added, so it terminates OTLP natively --
    # config-file-driven, not env-var-driven like v1. No config file is
    # mounted here, so it runs in its default all-in-one mode (in-memory
    # storage, OTLP receivers on 4317/4318, UI on 16686).
    image: jaegertracing/jaeger:2.20.0
    ports:
      # UI only. OTLP ingest happens over the compose network directly from
      # the application services, so 4317/4318 deliberately are not
      # published to the host.
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
