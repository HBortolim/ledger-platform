groups:
  - name: ledger-platform
    rules:
      # SPEC 9.5: Kafka is down (or the outbox worker is wedged) and unpublished events accumulate.
      - alert: OutboxBacklog
        expr: ledger_outbox_depth > 1000
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Outbox backlog: {{ $value }} unpublished events"
          description: "Projections lag and GET /balance reports stale until Kafka returns and the worker drains (SPEC 9.5, NFR-AVAIL-5)."

      # Task 06: drift_total adds the true finding count on every drifting pass, so alert on the
      # increase, not the absolute value. The 2h window covers two hourly passes.
      - alert: ReconciliationDrift
        expr: increase(ledger_reconciliation_drift_total[2h]) > 0
        labels:
          severity: page
        annotations:
          summary: "Reconciliation found drift in check {{ $labels.check }}"
          description: "invariant = unbalanced ledger (P0); projection = a wallet's projected balance disagrees with the ledger (rebuild it once the consumer is healthy); money_supply = the system does not net to zero."

      # The gauge only advances on a CLEAN pass, so this fires both when the job has died and when
      # drift persists. 7200s = 2x the default hourly interval. The "> 0" guard keeps it quiet on
      # a stack that has never completed a clean pass: the gauge starts at 0, which would otherwise
      # read as "last success in 1970" and fire for the first two hours of every fresh deployment.
      # The guard is folded into one expression ("(x > 0)" drops the zero series) rather than written
      # as "x > 0 and time() - x > 7200": "and" matches on every label including __name__, which the
      # right-hand side drops, so that form never matches anything.
      # A deployment where the job never produces a clean pass is still caught by ReconciliationDrift
      # (drift) and by the ledger_reconciliation_runs_total{result="error"} series (errors).
      - alert: ReconciliationStale
        expr: time() - (ledger_reconciliation_last_success_timestamp > 0) > 7200
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No clean reconciliation pass for over 2 hours"
          description: "Either the job is not running or it keeps finding drift or erroring (Task 06)."

      # Task 08 SEQ-9: parking is transient under normal cross-partition reordering (seconds). A
      # wallet still parked after 2 minutes is a gap that did not fill; recovery is a rebuild.
      - alert: ProjectionGapStuck
        expr: projection_pending_entries > 0
        for: 2m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} projection entries parked behind a gap for over 2 minutes"
          description: "An entry of some wallet did not arrive. The consumer logs the wallet and missing seq at error level after PENDING_ENTRY_ALERT_AFTER; rebuild the wallet."
