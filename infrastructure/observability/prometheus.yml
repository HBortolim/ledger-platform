global:
  scrape_interval: 15s

scrape_configs:
  - job_name: wallet-service
    static_configs:
      - targets: ['wallet-service:8080']
    metrics_path: /actuator/prometheus

  - job_name: ledger-service
    static_configs:
      - targets: ['ledger-service:8081']
    metrics_path: /metrics

  - job_name: projection-service
    static_configs:
      - targets: ['projection-service:8082']
    metrics_path: /metrics
