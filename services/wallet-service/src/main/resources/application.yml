server:
  port: 8080

spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:wallet_app}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet_app}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      initialization-fail-timeout: -1
  flyway:
    url: ${FLYWAY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
    user: ${FLYWAY_DATASOURCE_USERNAME:ledger}
    password: ${FLYWAY_DATASOURCE_PASSWORD:ledger}
    locations: classpath:db/migration
    schemas: wallet_db
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      # Always-on: a demo that drops the reviewer's one transfer is worthless
      # (milestone-5 overview, Global Constraints). Production would use a
      # parent-based ratio sampler.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  # Deliberately no management.opentelemetry.tracing.export.otlp.endpoint key here.
  #
  # Deviation from the milestone-5 brief: the brief's property,
  # management.otlp.tracing.endpoint, is deprecated at "error" level in Spring
  # Boot 4.0.6 (replacement: management.opentelemetry.tracing.export.otlp.endpoint)
  # and silently does not bind -- with it, tests passed but no exporter was ever
  # configured, so nothing was actually sent to the collector.
  #
  # Switching to the real property with a "${VAR:}" empty-string default doesn't
  # work either: OtlpTracingConfigurations.ConnectionDetails guards exporter
  # creation with @ConditionalOnProperty("...otlp.endpoint"), which (with no
  # havingValue) only checks the property is *present*, not that it's non-blank
  # -- so an empty string still activates OtlpHttpSpanExporter, which then throws
  # ("Invalid endpoint, must start with http:// or https://") on the blank value.
  #
  # Omitting the key entirely relies on Spring Boot's relaxed environment-variable
  # binding: docker-compose's MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # binds straight to management.opentelemetry.tracing.export.otlp.endpoint with no
  # YAML entry needed, so the property is genuinely absent (not empty) outside
  # compose -- matching the "no connection errors with no endpoint set" requirement.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","service":"wallet-service","trace_id":"%X{traceId}","span_id":"%X{spanId}","msg":"%m"}%n'

ledger:
  service:
    url: ${LEDGER_SERVICE_URL:http://localhost:8081}
  idempotency:
    ttl-hours: 24
    pending-sweep-seconds: 60

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
